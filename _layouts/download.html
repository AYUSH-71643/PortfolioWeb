---
layout: default
---
<main style="padding-top: 100px; background: linear-gradient(135deg, #f8f9fa 0%, #e0e5ec 100%); min-height: 100vh;">
    <section class="about-section" style="padding-top: 40px; text-align: center;">
        <h2 class="section-title">{{ page.game_title }}</h2>
        <div class="about-grid" style="display: flex; justify-content: center;">
            <div class="glass-card" style="width: 100%; max-width: 600px; padding: 40px;">
                <img src="{{ page.game_image }}" alt="{{ page.game_title }}" style="width: 100%; height: 250px; object-fit: cover; border-radius: 15px; margin-bottom: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">
                <h3 class="card-title">Choose Download Option</h3>
                
                <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 30px;">
                    <!-- Option 1: APK Download -->
                    <a href="{{ page.apk_link }}" class="btn" style="background: linear-gradient(135deg, #00C9FF 0%, #92FE9D 100%); font-size: 1.2rem; padding: 15px; border-radius: 30px; box-shadow: 0 5px 15px rgba(0,201,255,0.3); text-decoration: none; color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85-.29-.15-.65-.06-.81.24l-1.89 3.27C14.9 8.29 13.51 8 12 8s-2.9.29-4.48.96L5.63 5.68c-.16-.3-.52-.39-.81-.24-.3.16-.42.54-.26.85l1.84 3.18C3.44 11.2 1.5 14.36 1.5 18h21c0-3.64-1.94-6.8-4.9-8.52zM7 15.25c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm10 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
                        Download APK
                    </a>

                    <!-- Option 2: Google Play Store -->
                    <a href="{{ page.playstore_link }}" target="_blank" class="btn" style="background: #ffffff; border: 2px solid #ea4335; font-size: 1.2rem; padding: 15px; border-radius: 30px; box-shadow: 0 5px 15px rgba(234,67,53,0.2); text-decoration: none; color: #ea4335; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.3s ease;">
                        <svg width="24" height="24" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                            <path fill="#4caf50" d="M5.4 5.2c-.3.3-.5.9-.5 1.7v34.3c0 .8.2 1.3.5 1.7l.1.1 19.3-19.3v-.3L5.5 5.1l-.1.1z"/>
                            <path fill="#fbc02d" d="M30.6 30.3l-5.8-5.8v-.3l5.8-5.8.2.1 6.9 3.9c2 .5 2 1.6 0 2.2l-7 4-.1-.3z"/>
                            <path fill="#f44336" d="M24.8 24.3L5.5 5.1C6 4.7 6.8 4.6 7.8 5.2l22.8 13-5.8 6.1z"/>
                            <path fill="#2196f3" d="M30.6 30.3L7.8 43.1c-.9.5-1.8.4-2.3 0L24.8 24.3l5.8 6z"/>
                        </svg>
                        Get it on Google Play
                    </a>

                </div>
                
                <div style="margin-top: 30px;">
                    <a href="{{ site.baseurl }}/games.html" style="color: var(--primary); text-decoration: none; font-weight: bold;">&#8592; Back to Games</a>
                </div>
            </div>
        </div>
    </section>
</main>
